{% extends "base.html" %}
{% block title %}{{ line.name }} — Pilot Work{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>
<style>
  .pw-page{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg-base);}
  .pw-header{padding:16px 24px 12px;flex-shrink:0;}
  .pw-back{font-size:12px;color:var(--text-muted);text-decoration:none;display:inline-block;margin-bottom:8px;}
  .pw-title{font-size:18px;font-weight:800;color:var(--text-primary);}
  .pw-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}

  .pw-map-wrap{flex:1;min-height:0;position:relative;}
  .pw-map{width:100%;height:100%;background:var(--bg-elevated);}
  .pw-tower-marker{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .pw-tower-marker.done{background:#1f9d68;}
  .pw-tower-marker.pending{background:#c94b42;}
  .pw-map-popup-btn{margin-top:6px;padding:5px 12px;border-radius:6px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border:none;cursor:pointer;}
  .pw-map-popup-btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Zone badges — red/yellow/green risk classification, set by the pilot */
  .pw-zone-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .pw-zone-badge.red{background:rgba(201,75,66,.15);color:#c94b42;}
  .pw-zone-badge.yellow{background:rgba(217,168,29,.18);color:#a67c1a;}
  .pw-zone-badge.green{background:rgba(31,157,104,.15);color:#1f9d68;}
  .pw-zone-badge.unset{background:var(--bg-elevated-2);color:var(--text-muted);}

  .pw-tower-marker-label{
    background:transparent!important;border:none!important;box-shadow:none!important;
    color:#1b1e24!important;font-size:11px!important;font-weight:800!important;padding:0!important;
    text-shadow:0 1px 2px rgba(255,255,255,.85),0 0 4px rgba(255,255,255,.85)!important;
  }
  .pw-tower-marker-label::before{display:none;}
  .pw-labels-toggle{
    position:absolute;top:88px;left:16px;z-index:1001;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;
    padding:7px 14px;font-size:11.5px;font-weight:700;color:var(--text-primary);
    cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;gap:7px;
  }
  .pw-labels-toggle-dot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);}
  .pw-labels-toggle.on .pw-labels-toggle-dot{background:var(--accent);}

  /* Zone selector — inline in the tower row and map popup, light UI
     matching the rest of the app rather than a separate full-screen step */
  .pw-zone-inline{display:flex;gap:6px;margin-top:6px;}
  .pw-zone-chip{
    padding:4px 10px;border-radius:14px;border:1.5px solid transparent;
    cursor:pointer;font-size:10.5px;font-weight:700;text-transform:uppercase;
    background:var(--bg-elevated-2);color:var(--text-muted);
  }
  .pw-zone-chip.red{background:rgba(201,75,66,.1);color:#c94b42;}
  .pw-zone-chip.red.selected{border-color:#c94b42;background:rgba(201,75,66,.22);}
  .pw-zone-chip.yellow{background:rgba(217,168,29,.12);color:#a67c1a;}
  .pw-zone-chip.yellow.selected{border-color:#d9a81d;background:rgba(217,168,29,.28);}
  .pw-zone-chip.green{background:rgba(31,157,104,.1);color:#1f9d68;}
  .pw-zone-chip.green.selected{border-color:#1f9d68;background:rgba(31,157,104,.22);}

  /* Tower list — slides in from the right, toggled by the arrow tab */
  .pw-list-panel{
    position:absolute;top:0;right:0;bottom:0;width:340px;max-width:85vw;
    background:var(--bg-elevated);border-left:1px solid var(--border);
    box-shadow:-4px 0 16px rgba(0,0,0,.12);
    transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;z-index:500;
  }
  .pw-list-panel.open{transform:translateX(0);}
  .pw-list-toggle{
    position:absolute;top:16px;right:340px;
    width:32px;height:44px;border:1px solid var(--border);border-right:none;
    border-radius:8px 0 0 8px;background:var(--bg-elevated);color:var(--text-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-size:14px;transition:right .25s ease;z-index:501;
  }
  .pw-list-toggle.collapsed{right:0;}
  .pw-list-head{padding:16px 18px 10px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
  .pw-list-body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;}

  .pw-tower-row{display:flex;flex-wrap:nowrap;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;background:var(--bg-elevated);}
  .pw-tower-name{font-size:13.5px;font-weight:700;color:var(--text-primary);}
  .pw-tower-status{font-size:11px;margin-top:2px;}
  .pw-tower-status.done{color:var(--success);}
  .pw-tower-status.pending{color:var(--text-muted);}
  .pw-tower-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;width:82px;}
  .pw-capture-btn{padding:8px 6px;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border:none;cursor:pointer;width:100%;box-sizing:border-box;text-align:center;}
  .pw-capture-btn:disabled{opacity:.5;cursor:not-allowed;}
  .pw-nav-btn{
    display:flex;align-items:center;justify-content:center;width:100%;padding:7px 0;border-radius:8px;
    background:var(--bg-elevated-2);border:1px solid var(--border);color:var(--text-primary);
    font-size:16px;text-decoration:none;box-sizing:border-box;cursor:pointer;
  }

  /* OpenStreetMap requires this attribution to stay visible per their
     tile usage policy — it can't be removed outright, but it can be much
     less obtrusive than Leaflet's chunky default styling. */
  .leaflet-control-attribution{font-size:9px;padding:1px 5px;opacity:.55;background:rgba(255,255,255,.65);}
  .pw-route-label{
    background:rgba(61,107,143,.95)!important;border:none!important;box-shadow:0 1px 3px rgba(0,0,0,.4)!important;
    padding:3px 9px!important;font-size:11px!important;font-weight:700;color:#fff;border-radius:20px!important;
  }
  .pw-route-label::before{display:none;}
  .leaflet-control-attribution:hover{opacity:.9;}
</style>
{% endblock %}

{% block body %}
<div class="pw-page">
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-weight:800;color:var(--text-primary);">DROGO AEROSPACE</span>
      <span style="font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(61,107,143,.12);color:#3d6b8f;">PILOT</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="font-size:13px;color:var(--text-secondary);">{{ user_name }}</span>
      <form method="POST" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="btn-logout">Logout</button></form>
    </div>
  </nav>

  <div class="pw-header">
    <a class="pw-back" href="{{ url_for('pilot_dashboard') }}">← Assigned Work</a>
    <div class="pw-title">{{ line.name }}</div>
    <div class="pw-sub" id="pw-progress-text">Loading towers…</div>
  </div>

  <div class="pw-map-wrap">
    <div id="pw-map" class="pw-map"></div>

    <button class="pw-labels-toggle" id="pw-labels-toggle" onclick="toggleTowerLabels()">
      <span class="pw-labels-toggle-dot"></span> Tower Numbers
    </button>

    <button class="pw-list-toggle" id="pw-list-toggle" onclick="toggleTowerListPanel()">›</button>

    <div class="pw-list-panel open" id="pw-list-panel">
      <div class="pw-list-head">
        <div style="font-size:13px;font-weight:800;color:var(--text-primary);">Towers</div>
      </div>
      <div class="pw-list-body" id="pw-tower-list"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const LINE_ID = {{ line.id }};
const LINE_KML_URL = {{ kml_url | tojson }};

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function pickTowerLabel(props) {
  if (!props) return '';
  for (const key of ['name', 'Name', 'NAME', 'tower', 'Tower', 'label', 'Label']) {
    if (props[key] != null && String(props[key]).trim()) return String(props[key]).trim();
  }
  const vals = Object.values(props).filter(v => v != null && String(v).trim());
  return vals.length ? String(vals[0]).trim() : '?';
}

let towerPoints = [];
let submittedLabels = new Set();
let towerZones = {}; // label -> 'red'/'yellow'/'green'
let showTowerLabels = false;
let pwMap = null;
let pwTowerMarkers = {}; // label -> Leaflet marker

async function init() {
  if (!LINE_KML_URL) {
    document.getElementById('pw-progress-text').textContent = 'No KML uploaded for this line yet — nothing to work on.';
    document.getElementById('pw-map').style.display = 'none';
    return;
  }
  let geojson;
  try {
    const kmlRes = await fetch(LINE_KML_URL);
    const kmlText = await kmlRes.text();
    const kmlDom = new DOMParser().parseFromString(kmlText, 'text/xml');
    geojson = toGeoJSON.kml(kmlDom);
    towerPoints = (geojson.features || [])
      .filter(f => f.geometry && f.geometry.type === 'Point')
      .map(f => ({ label: pickTowerLabel(f.properties), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }));
  } catch (e) {
    document.getElementById('pw-progress-text').textContent = "Could not read this line's KML.";
    document.getElementById('pw-map').style.display = 'none';
    return;
  }

  if (!towerPoints.length) {
    document.getElementById('pw-progress-text').textContent = 'No tower points found in this KML.';
    document.getElementById('pw-map').style.display = 'none';
    return;
  }

  await loadTowerZones();
  initMap(geojson);
  renderTowerList();
}

async function loadTowerZones() {
  try {
    const res = await fetch(`/api/lines/${LINE_ID}/tower-zones`);
    const data = await res.json();
    towerZones = data.zones || {};
    submittedLabels = new Set(data.submitted_labels || []);
  } catch (e) { towerZones = {}; submittedLabels = new Set(); }
}

// The same KML assigned to this line in the admin portal — rendered here
// exactly like the admin's map (line path + tower points), so a pilot
// sees the real geographic layout, not just a flat list of tower names.
function initMap(geojson) {
  pwMap = L.map('pw-map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
  }).addTo(pwMap);

  const bounds = [];
  (geojson.features || []).forEach(feat => {
    const geom = feat.geometry;
    if (!geom) return;
    if (geom.type === 'LineString' || geom.type === 'MultiLineString') {
      const segments = geom.type === 'LineString' ? [geom.coordinates] : geom.coordinates;
      segments.forEach(coords => {
        const latlngs = coords.map(c => [c[1], c[0]]);
        L.polyline(latlngs, { color: '#1b1e24', weight: 3, opacity: 0.85 }).addTo(pwMap);
        latlngs.forEach(ll => bounds.push(ll));
      });
    }
  });

  towerPoints.forEach(t => {
    const marker = renderTowerMarker(t);
    bounds.push([t.lat, t.lng]);
  });

  if (bounds.length) pwMap.fitBounds(bounds, { padding: [24, 24] });
  else pwMap.setView([towerPoints[0].lat, towerPoints[0].lng], 14);
}

function renderTowerMarker(t) {
  const done = submittedLabels.has(t.label);
  const icon = L.divIcon({
    className: '',
    html: `<div class="pw-tower-marker ${done ? 'done' : 'pending'}"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7],
  });
  const marker = L.marker([t.lat, t.lng], { icon }).addTo(pwMap);
  marker.bindTooltip(t.label, {
    permanent: true, direction: 'top', offset: [0, -8], className: 'pw-tower-marker-label',
  });
  if (!showTowerLabels) marker.closeTooltip();
  marker.bindPopup(buildTowerPopupHtml(t));
  pwTowerMarkers[t.label] = marker;
  return marker;
}

function buildTowerPopupHtml(t) {
  const done = submittedLabels.has(t.label);
  const zone = towerZones[t.label] || '';
  return `
    <div style="min-width:170px;">
      <b>Tower ${escapeHtml(t.label)}</b><br/>
      ${done ? '✓ Submitted' : 'Not submitted yet'}
      <div class="pw-zone-inline" style="margin:8px 0;">
        <button class="pw-zone-chip red ${zone === 'red' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "red")'>Red</button>
        <button class="pw-zone-chip yellow ${zone === 'yellow' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "yellow")'>Yellow</button>
        <button class="pw-zone-chip green ${zone === 'green' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "green")'>Green</button>
      </div>
      <button class="pw-map-popup-btn" style="width:100%;" onclick='showRouteToTower(${JSON.stringify(t)})' title="Show route on map">🧭 Route</button>
      <button class="pw-map-popup-btn" style="width:100%;margin-top:6px;" ${zone ? '' : 'disabled title="Set a zone first"'} onclick='submitTower(${JSON.stringify(t.label)})'>${done ? '✓ Submitted' : 'Submit Tower'}</button>
    </div>`;
}

function toggleTowerLabels() {
  showTowerLabels = !showTowerLabels;
  document.getElementById('pw-labels-toggle').classList.toggle('on', showTowerLabels);
  Object.values(pwTowerMarkers).forEach(marker => {
    if (showTowerLabels) marker.openTooltip();
    else marker.closeTooltip();
  });
}

function toggleTowerListPanel() {
  const panel = document.getElementById('pw-list-panel');
  const toggle = document.getElementById('pw-list-toggle');
  const isOpen = panel.classList.toggle('open');
  toggle.classList.toggle('collapsed', !isOpen);
  toggle.textContent = isOpen ? '›' : '‹';
  // The map's own container size doesn't change (the panel overlays on
  // top rather than resizing it), but Leaflet still needs a nudge after
  // any layout change nearby, or tiles can render at the wrong size
  // until the next pan/zoom.
  if (pwMap) setTimeout(() => pwMap.invalidateSize(), 260);
}

function refreshTowerMarker(label) {
  const marker = pwTowerMarkers[label];
  if (!marker || !pwMap) return;
  const done = submittedLabels.has(label);
  marker.setIcon(L.divIcon({
    className: '',
    html: `<div class="pw-tower-marker ${done ? 'done' : 'pending'}"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7],
  }));
  marker.closePopup();
}

function renderTowerList() {
  const doneCount = towerPoints.filter(t => submittedLabels.has(t.label)).length;
  document.getElementById('pw-progress-text').textContent = `${doneCount}/${towerPoints.length} towers captured`;

  const sorted = [...towerPoints].sort((a, b) => {
    const aDone = submittedLabels.has(a.label), bDone = submittedLabels.has(b.label);
    if (aDone !== bDone) return aDone ? 1 : -1;
    return a.label.localeCompare(b.label, undefined, { numeric: true });
  });

  document.getElementById('pw-tower-list').innerHTML = sorted.map(t => {
    const done = submittedLabels.has(t.label);
    const zone = towerZones[t.label] || '';
    const zonePicker = `
      <div class="pw-zone-inline">
        <button class="pw-zone-chip red ${zone === 'red' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "red")'>Red</button>
        <button class="pw-zone-chip yellow ${zone === 'yellow' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "yellow")'>Yellow</button>
        <button class="pw-zone-chip green ${zone === 'green' ? 'selected' : ''}" onclick='setZoneInline(${JSON.stringify(t.label)}, "green")'>Green</button>
      </div>`;
    return `
      <div class="pw-tower-row">
        <div style="flex:1;min-width:0;">
          <div class="pw-tower-name">Tower ${escapeHtml(t.label)}</div>
          <div class="pw-tower-status ${done ? 'done' : 'pending'}">${done ? '✓ Submitted' : 'Not submitted yet'}</div>
          ${zonePicker}
        </div>
        <div class="pw-tower-actions">
          <button class="pw-nav-btn" title="Show route on map" onclick='showRouteToTower(${JSON.stringify(t)})'>🧭</button>
          <button class="pw-capture-btn" ${zone ? '' : 'disabled title="Set a zone first"'} onclick='submitTower(${JSON.stringify(t.label)})'>${done ? '✓ Submitted' : 'Submit Tower'}</button>
        </div>
      </div>`;
  }).join('');
}

async function setZoneInline(label, zone) {
  let res, data;
  try {
    res = await fetch(`/api/lines/${LINE_ID}/towers/${encodeURIComponent(label)}/zone`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ zone }),
    });
    data = await res.json();
  } catch (e) {
    alert('Network error — could not save zone.');
    return;
  }
  if (!res.ok) { alert(data.error || 'Could not save zone.'); return; }
  // The save itself already succeeded at this point — anything below is
  // just refreshing the UI, kept outside the network try/catch so a
  // rendering issue can't get mislabeled as a failed save.
  towerZones[label] = zone;
  renderTowerList();
  refreshTowerMarkerPopup(label);
}

function refreshTowerMarkerPopup(label) {
  const marker = pwTowerMarkers[label];
  const tower = towerPoints.find(t => t.label === label);
  if (!marker || !tower) return;
  marker.setPopupContent(buildTowerPopupHtml(tower));
}

// ── In-app route — a straight line from the pilot's current position to
// the tower, drawn right on this same map, with the distance labeled.
// This is NOT turn-by-turn driving directions (that needs a paid
// directions API we don't have) — it's an honest "as the crow flies"
// bearing + distance, same idea as a compass, so it's clearly labeled
// that way rather than implying it's a real route.
let routeLine = null;
let routeMeMarker = null;

function clearRoute() {
  if (routeLine) { pwMap.removeLayer(routeLine); routeLine = null; }
  if (routeMeMarker) { pwMap.removeLayer(routeMeMarker); routeMeMarker = null; }
}

function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

async function showRouteToTower(tower) {
  if (!navigator.geolocation) {
    alert("This device doesn't support location — can't show a route.");
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const from = [pos.coords.latitude, pos.coords.longitude];
    const to = [tower.lat, tower.lng];
    clearRoute();

    const meIcon = L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:#3d6b8f;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);"></div>`,
      iconSize: [14, 14], iconAnchor: [7, 7],
    });
    routeMeMarker = L.marker(from, { icon: meIcon }).addTo(pwMap)
      .bindTooltip('You', { permanent: true, direction: 'top', offset: [0, -8] });

    const straightM = haversineMeters(from[0], from[1], to[0], to[1]);

    // Real road-following route via OSRM's free public routing server (no
    // API key — this is a shared community instance, so it can be slow
    // or briefly unavailable under load; falls back to a straight line
    // with distance if it doesn't respond in time).
    try {
      const url = `https://router.project-osrm.org/route/v1/driving/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      const data = await res.json();
      const route = data.routes && data.routes[0];
      if (!route) throw new Error('no route found');

      const latlngs = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      routeLine = L.polyline(latlngs, { color: '#3d6b8f', weight: 5, opacity: 0.85 }).addTo(pwMap);

      const distLabel = route.distance >= 1000 ? `${(route.distance / 1000).toFixed(1)} km` : `${Math.round(route.distance)} m`;
      const mins = Math.round(route.duration / 60);
      const durLabel = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins} min`;
      routeLine.bindTooltip(`${distLabel} · ${durLabel} to Tower ${tower.label}`, { permanent: true, direction: 'center', className: 'pw-route-label' }).openTooltip();
      pwMap.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
    } catch (e) {
      // Routing server didn't answer in time — fall back to a plain
      // straight line so the pilot still gets SOME guidance rather than
      // nothing, clearly labeled as a fallback.
      routeLine = L.polyline([from, to], { color: '#3d6b8f', weight: 4, dashArray: '8 6' }).addTo(pwMap);
      const distLabel = straightM >= 1000 ? `${(straightM / 1000).toFixed(2)} km` : `${Math.round(straightM)} m`;
      routeLine.bindTooltip(`${distLabel} to Tower ${tower.label} (straight line — route server unavailable)`, { permanent: true, direction: 'center', className: 'pw-route-label' }).openTooltip();
      pwMap.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
    }
  }, () => {
    alert('Could not read your current location — check location permissions and try again.');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

async function submitTower(label) {
  try {
    const res = await fetch(`/api/lines/${LINE_ID}/towers/${encodeURIComponent(label)}/pilot-submit`, {
      method: 'POST',
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Could not submit this tower.'); return; }
    submittedLabels.add(label);
    renderTowerList();
    refreshTowerMarkerPopup(label);
    refreshTowerMarker(label);
  } catch (e) {
    alert('Network error — could not submit this tower.');
  }
}

// ── Live location tracking — reports this Pilot's current position to
// Admin's map periodically, with their consent (browser geolocation
// permission prompt on entry). Not tied to any specific tower — just
// "where is this pilot right now", refreshed on an interval.
let pilotWatchId = null;

function startLocationTracking() {
  if (!navigator.geolocation) return;
  pilotWatchId = navigator.geolocation.watchPosition(
    (pos) => pingPilotLocation(pos.coords.latitude, pos.coords.longitude),
    () => { /* silently skip a failed reading — not worth interrupting the pilot's work over */ },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 15000 }
  );
}

let _lastLocationPingAt = 0;
async function pingPilotLocation(lat, lng) {
  const now = Date.now();
  if (now - _lastLocationPingAt < 20000) return; // at most once per 20s, even if watchPosition fires more often
  _lastLocationPingAt = now;
  try {
    await fetch('/api/pilot/location', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lng }),
    });
  } catch (e) { /* next reading will retry */ }
}

startLocationTracking();
init();
</script>
